# Hosts conhecidos, por categoria — usados por S-04 para anotar achados.
categorias:
  analytics: [analytics.google.com, api.segment.io, api.mixpanel.com, api.amplitude.com]
  llm: [api.openai.com, api.anthropic.com, generativelanguage.googleapis.com]
  cdn: [cdn.jsdelivr.net, cdnjs.cloudflare.com, unpkg.com]
ignorar: [localhost, 127.0.0.1, example.com, example.org, w3.org, json-schema.org, schema.org]

# E-13: hosts que aparecem em METADADO de dependencia (registro, licenca,
# documentacao) e nao representam egresso em runtime. Lista propria e estreita
# — separada de `ignorar` para que ninguem silencie um destino real de dado
# alegando que "e so metadado". O teste-guarda proibe que qualquer host das
# categorias conhecidas entre aqui.
ignorar_em_dependencias:
  - registry.npmjs.org
  - npmjs.org
  - npmjs.com
  - yarnpkg.com
  - github.com
  - raw.githubusercontent.com
  - gitlab.com
  - nodejs.org
  - python.org
  - pypi.org
  - files.pythonhosted.org
  - opensource.org
  - spdx.org
  - apache.org
  - gnu.org
  - mozilla.org
  - tldrlegal.com
  - unlicense.org
  - creativecommons.org
