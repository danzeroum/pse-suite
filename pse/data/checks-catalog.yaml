# Catalogo dos checks da PSE Suite — a declaracao autoritativa (D-12).
#
# Sem este arquivo o laudo so sabia dizer "executado" ou "pulado"; nao sabia
# dizer "previsto e ausente". E dizer isso e pre-requisito da Fase 2: e o que
# faz um check runtime sem alvo declarado aparecer no laudo com motivo, em vez
# de simplesmente nao existir — e o que torna calculavel a metrica de cobertura
# do plano §8.
#
# `status` e o estado nesta versao do pacote:
#   implementado      — registrado e executavel
#   previsto-fase-2   — Trabalho A (runtime), roadmap Fase 2
#   previsto-fase-3   — roadmap Fase 3
#
# `domain` e a segunda dimensao: o ESTRATO TECNICO que o check examina
# (frontend | api | backend | data | ai). Pode ser lista — S-07 olha a borda
# e a trilha, entao vale para api e backend.
#
# Pilar e dominio sao ortogonais de proposito. O pilar responde "que valor
# esta em jogo" (privacidade, seguranca, etica); o dominio responde "onde
# isso se manifesta no sistema". Um consumidor de time de frontend quer
# `--domain frontend` sem deixar de ser auditado nos tres pilares; um DPO
# quer `--pilar privacy` atravessando todos os estratos. A matriz serve aos
# dois sem duplicar check nenhum.
#
# `modo` diz onde o check pode rodar (contrato de autorizacao, COMO-ADOTAR §5):
#   inventory — Trabalho B, sem rede, agente pode disparar
#   passive   — Trabalho A somente-leitura, com a propria identidade
#   active    — Trabalho A com sonda de autorizacao; workflow_dispatch + revisores
#
# O conjunto CRITICO (fail-closed) e ratificado no plano §4 + Etapa 3 §2.4:
#   P-01, P-06, P-08, P-11, S-01, S-04(dpa), S-06, E-04

checks:
  # -------------------------------------------------- Pacote P — Privacidade
  P-01:
    pack: privacy
    domain: [backend]
    titulo: PII em logs/prints sem mascaramento
    base_legal: LGPD Art. 46
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: valor de PII vai cru para a chamada de log
      arquivos:
        app.py: |
          import logging
          logger = logging.getLogger(__name__)


          def f(cpf):
              logger.info("cadastro cpf=%s", cpf)
      espera_severidade: CRITICO
  P-02:
    pack: privacy
    domain: [data]
    titulo: Retencao declarada sem job de purga
    base_legal: LGPD Art. 15-16
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: catalogo declara retencao e nao ha job de purga que apague
      arquivos:
        catalog.yaml: |
          tables:
            users:
              fields:
                cpf:
                  class: personal
                  owner: o
                  purpose: p
                  legal_basis: contrato
                  retention_years: 5
      config:
        catalog_path: catalog.yaml
      espera_severidade: ALTO
  P-03:
    pack: privacy
    domain: [data]
    titulo: Soft-delete sem eliminacao fisica / crypto-shredding
    base_legal: LGPD Art. 18 VI
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: soft-delete sem eliminacao definitiva
      arquivos:
        models.py: |
          class User:
              deleted_at = None
      espera_severidade: ALTO
  P-04:
    pack: privacy
    domain: [data]
    titulo: Catalogo vivo de dados
    base_legal: LGPD Art. 37
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: campo do catalogo sem dono, base legal e retencao
      arquivos:
        catalog.yaml: |
          tables:
            users:
              fields:
                email:
                  class: personal
                  purpose: contato
      config:
        catalog_path: catalog.yaml
      espera_severidade: MEDIO
  P-05:
    pack: privacy
    domain: [api]
    titulo: Minimizacao por jornada — DTO rejeita campo fora da allowlist
    base_legal: LGPD Art. 6o III
    tipo: estatico+runtime
    modo: active
    fase: 2
    status: implementado
    canonical_mutation:
      descricao: POST com campo fora da allowlist e aceito
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          escrita: /api/clientes
        respostas:
          - status: 201
            corpo: '{"id":"novo"}'
      espera_severidade: ALTO
  P-06:
    pack: privacy
    domain: [backend]
    titulo: Pseudonimizacao com chave segregada
    base_legal: LGPD Art. 46
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: chave de pseudonimizacao em texto claro na fonte
      arquivos:
        app.py: |
          hmac_key = "segredo-plantado-1234567890"
      espera_severidade: CRITICO
  P-07:
    pack: privacy
    domain: [api, data]
    titulo: Consentimento granular por finalidade, opt-in, com registro
    base_legal: LGPD Art. 7o-8o
    tipo: estatico+runtime
    modo: active
    fase: 3
    status: implementado
    canonical_mutation:
      descricao: rota protegida por consentimento responde 200 sem consentimento
      runtime:
        autorizacao_valida: true
        modo: pse_active
        endpoints:
          consentimento_protegido: /api/perfil
        respostas:
          - status: 200
            corpo: '{"perfil":{}}'
      espera_severidade: CRITICO
  P-08:
    pack: privacy
    domain: [data]
    titulo: Dado sensivel nunca com base legal legitimo interesse
    base_legal: LGPD Art. 11
    tipo: estatico
    modo: inventory
    fase: 1
    status: implementado
    canonical_mutation:
      descricao: dado sensivel com base legal legitimo interesse
      arquivos:
        catalog.yaml: |
