# Catalogo dos checks da PSE Suite — a declaracao autoritativa (D-12).
#
# Sem este arquivo o laudo so sabia dizer "executado" ou "pulado"; nao sabia
# dizer "previsto e ausente". E dizer isso e pre-requisito da Fase 2: e o que
# faz um check runtime sem alvo declarado aparecer no laudo com motivo, em vez
# de simplesmente nao existir — e o que torna calculavel a metrica de cobertura
# do plano §8.
#
# `status` e o estado nesta versao do pacote:
#   implementado      — registrado e executavel
#   previsto-fase-2   — Trabalho A (runtime), roadmap Fase 2
#   previsto-fase-3   — roadmap Fase 3
#
# `modo` diz onde o check pode rodar (contrato de autorizacao, COMO-ADOTAR §5):
#   inventory — Trabalho B, sem rede, agente pode disparar
#   passive   — Trabalho A somente-leitura, com a propria identidade
#   active    — Trabalho A com sonda de autorizacao; workflow_dispatch + revisores
#
# O conjunto CRITICO (fail-closed) e ratificado no plano §4 + Etapa 3 §2.4:
#   P-01, P-06, P-08, P-11, S-01, S-04(dpa), S-06, E-04

